<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1219" />
    <meta name="description" content="Inspect texture tiling, offsets, mirrored repetition, and potential seams directly in your browser." />
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/favicon.svg?v=2" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <title>TILECHECK — Texture Inspection Studio</title>
    <script defer src="./assets/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="./" aria-label="TILECHECK home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>TILE<span class="brand-accent">CHECK</span></span>
          
        </a>

        <nav class="header-nav" aria-label="Site navigation"><a class="header-nav-link" href="https://github.com/Treenixie/Tilecheck" target="_blank" rel="noopener noreferrer">GitHub</a><a class="header-nav-link" href="./help.html">Support</a></nav>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Texture settings">
          <h1>Texture inspector<span class="period">.</span></h1>
          
          <div class="upload-card" id="uploadZone">
            <div class="upload-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg></div>
            <strong>Drop a texture here</strong>
            <span>PNG, JPG, WEBP or AVIF · up to 25 MB</span>
            <button type="button" id="chooseBtn" class="button button-outline">CHOOSE IMAGE</button>
            <input type="file" accept="image/png,image/jpeg,image/webp,image/avif" id="fileInput" hidden />
          </div>
          <div class="file-summary">
            <span class="file-graphic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg></span>
            <div class="file-copy"><strong id="fileName">Concrete / sample</strong><span id="fileDetails">512 × 512 · demo texture</span></div>
            <button id="sampleBtn" type="button" class="text-button" title="Restore demo texture">RESET</button>
          </div>
          <div class="control-group" id="repeatControl">
            <div class="control-title"><label for="repeatRange">Tile grid</label><output for="repeatRange" id="repeatValue">3 × 3</output></div>
            <input type="range" min="2" max="6" value="3" step="1" id="repeatRange" />
            <div class="range-ticks"><span>2 × 2</span><span>6 × 6</span></div>
          </div>
          <div class="control-group">
            <div class="control-title"><label for="zoomRange">Preview zoom</label><output for="zoomRange" id="zoomValue">100%</output></div>
            <input type="range" min="50" max="200" value="100" step="10" id="zoomRange" />
            <div class="range-ticks"><span>50%</span><span>200%</span></div>
          </div>
          <div class="control-group offset-controls" id="offsetControls" hidden>
            <div class="control-title"><label for="offsetX">Horizontal offset</label><output for="offsetX" id="offsetXValue">50%</output></div>
            <input type="range" min="0" max="100" value="50" step="1" id="offsetX" />
            <div class="control-title second-control"><label for="offsetY">Vertical offset</label><output for="offsetY" id="offsetYValue">50%</output></div>
            <input type="range" min="0" max="100" value="50" step="1" id="offsetY" />
          </div>
          <label class="toggle-row" for="guideToggle"><span>Show tile boundaries</span><input id="guideToggle" type="checkbox" /><span class="toggle" aria-hidden="true"></span></label>

        </aside>

        <main class="main" aria-label="Texture preview">
          <div class="preview-header">
            <h2 id="previewTitle">Repeat pattern</h2>
            <div class="preview-tools"><button class="icon-button" id="fitBtn" type="button" title="Reset zoom" aria-label="Reset zoom"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg></button></div>
          </div>
          <div class="mode-tabs" role="tablist" aria-label="Preview mode">
            <button type="button" role="tab" class="mode-tab active" id="tab-tile" aria-selected="true" data-mode="tile">TILE</button>
            <button type="button" role="tab" class="mode-tab" id="tab-offset" aria-selected="false" data-mode="offset">OFFSET</button>
            <button type="button" role="tab" class="mode-tab" id="tab-mirror" aria-selected="false" data-mode="mirror">MIRROR</button>
            <button type="button" role="tab" class="mode-tab" id="tab-seams" aria-selected="false" data-mode="seams">SEAM MAP</button>
            <button type="button" role="tab" class="mode-tab" id="tab-original" aria-selected="false" data-mode="original">ORIGINAL</button>
          </div>
          <div class="viewer" id="viewer" aria-label="Texture canvas, drag and drop an image to upload">
            <canvas id="previewCanvas" aria-label="Current texture preview" role="img"></canvas>
            <div class="viewer-label" id="viewerLabel">3 × 3 · NORMAL REPEAT</div>
            <div class="drop-overlay" id="dropOverlay" hidden><div>↥<br/><span>DROP TO INSPECT</span></div></div>
          </div>
          <div class="viewer-footer"><span id="dimensionLabel">512 × 512 PX</span></div>
          <div class="export-bar">
            <div class="export-buttons"><button type="button" class="button button-outline" id="exportOffset">EXPORT OFFSET</button><button type="button" class="button button-primary" id="exportPreview">EXPORT PREVIEW</button></div>
          </div>
        </main>
      </div>
      <footer class="footer" aria-label="TILECHECK project links">
        <a class="footer-wordmark" href="./" aria-label="Back to TILECHECK">TILE<span>CHECK</span></a>
        <div class="footer-meta">© <span id="year"></span> TILECHECK <span class="footer-meta-divider" aria-hidden="true">/</span> MADE BY <a href="https://github.com/Treenixie" target="_blank" rel="noopener noreferrer" class="author-link">TREENIXIE</a></div>
      </footer>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
  </body>
</html>
